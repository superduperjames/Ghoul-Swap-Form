<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎃 Ghoul Swap Form</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://res.cloudinary.com/eventmobi/image/upload/v1761237992/_James%20Assets/.test%20app%20assets/Abstract%20Backgrounds/Haunted%20Background/2151153754.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      font-size: 2em;
      color: white;
      margin-top: 40px;
      margin-bottom: 25px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto 60px auto;
      background: rgba(0, 0, 0, 0.65);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
      display: flex;
      gap: 40px; /* Adds spacing between left and right boxes */
      justify-content: space-between;
      align-items: stretch;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px; /* More space between input boxes */
      height: 100%;
    }

    input, textarea {
      width: 100%;
      padding: 15px 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.9em;
    }

    .box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .coffee-box {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    button {
      background: #ff4b4b;
      color: #fff;
      border: none;
      padding: 12px 16px;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
      align-self: flex-end;
      margin-top: auto;
    }

    button:hover {
      background: #ff2222;
      transform: scale(1.02);
    }

    .menu-link {
      background: transparent;
      color: #ff4b4b;
      font-size: 0.9em;
      text-align: center;
      text-decoration: underline;
      transition: 0.2s ease;
      margin-top: 10px;
      display: block;
    }

    .menu-link:hover {
      background: #ff4b4b;
      color: white;
    }

    .loading {
      text-align: center;
      margin-top: 10px;
      color: #ccc;
      display: none;
    }

    /* Admin Login button */
    .admin-login {
      position: fixed;
      top: 15px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #ff4b4b;
      cursor: pointer;
      font-size: 0.9em;
      transition: 0.2s ease;
    }

    .admin-login:hover {
      background: #ff4b4b;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        gap: 30px;
      }
      button {
        align-self: stretch;
      }
    }
  </style>
</head>
<body>

  <h1>👻 Ghoul Swap & Coffee Order</h1>

  <div class="container">
    <!-- Left: Ghoul Swap Form -->
    <div class="box">
      <form id="ghoulForm">
        <input name="realName" placeholder="Real Name*" required>
        <input name="codeName" placeholder="Code Name*" required>
        <input name="gender" placeholder="Gender*" required>
        <input name="wish1" placeholder="Wish Item 1">
        <input name="wish2" placeholder="Wish Item 2">
        <input name="wish3" placeholder="Wish Item 3">
        <div class="loading" id="loading">Saving your entry… don’t wake the spirits 👻</div>
      </form>
    </div>

    <!-- Right: Coffee Order -->
    <div class="coffee-box">
      <div>
        <textarea form="ghoulForm" name="coffeeOrder" placeholder="Starbucks Coffee Order"></textarea>
        <a href="https://www.starbucks.com/menu" target="_blank" class="menu-link">☕ See Menu</a>
      </div>
      <button type="submit" form="ghoulForm">Submit Swap Gift Entry and Coffee Order</button>
    </div>
  </div>

  <div class="admin-login" id="adminLogin">🔑 Admin Login</div>

  <script>
    // ✅ Your live Google Apps Script Web App URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzLy2-3wj0RsdCLRi_0SKEacC_TPC30fBKNsXgDxWmE2j1aw5H2QFu6zbbQHJv9-zrvWA/exec';

    const form = document.getElementById('ghoulForm');
    const loading = document.getElementById('loading');
    const adminLogin = document.getElementById('adminLogin');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      loading.style.display = 'block';

      const formData = new FormData(form);

      try {
        const response = await fetch(scriptURL, { method: 'POST', body: formData });
        const text = await response.text();

        if (text.includes('Success')) {
          alert('🕸️ Your entry has been saved!');
          form.reset();
        } else {
          alert('⚠️ Failed to save entry. Please try again.');
        }
      } catch (error) {
        console.error(error);
        alert('👻 Network error. Please try again.');
      } finally {
        loading.style.display = 'none';
      }
    });

    // 🔐 Admin password prompt + download trigger
    adminLogin.addEventListener('click', () => {
      const password = prompt('Enter Admin Password:');
      if (password === 'escape2025') {
        window.open(scriptURL, '_blank');
      } else if (password) {
        alert('❌ Wrong password, spirit denied access!');
      }
    });
  </script>

</body>
</html>
