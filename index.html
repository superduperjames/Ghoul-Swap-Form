<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎃 Ghoul Swap Form</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://res.cloudinary.com/eventmobi/image/upload/v1761237992/_James%20Assets/.test%20app%20assets/Abstract%20Backgrounds/Haunted%20Background/2151153754.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 60px auto;
      background: rgba(0, 0, 0, 0.65);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
    }
    h1 {
      text-align: center;
      font-size: 2em;
      color: #ff6666;
      margin-bottom: 25px;
    }
    form {
      display: grid;
      gap: 10px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
    }
    button {
      background: #ff4b4b;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1.1em;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover {
      background: #ff2222;
      transform: scale(1.02);
    }
    .admin-download {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid #ff4b4b;
      cursor: pointer;
      font-size: 0.9em;
      transition: 0.2s ease;
    }
    .admin-download:hover {
      background: #ff4b4b;
    }
    .loading {
      text-align: center;
      margin-top: 10px;
      color: #ccc;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>👻 Ghoul Swap & Coffee Order</h1>

    <form id="ghoulForm">
      <input name="Real Name" placeholder="Real Name*" required>
      <input name="Code Name" placeholder="Code Name*" required>
      <input name="Gender" placeholder="Gender*" required>
      <input name="Wish 1" placeholder="Wish Item 1">
      <input name="Wish 2" placeholder="Wish Item 2">
      <input name="Wish 3" placeholder="Wish Item 3">
      <textarea name="Coffee Order" placeholder="Starbucks Coffee Order"></textarea>
      <button type="submit">Submit Swap Gift Entry ☕</button>
      <div class="loading" id="loading">Saving your entry… don’t wake the spirits 👻</div>
    </form>
  </div>

  <div class="admin-download" id="downloadBtn">📜 Download All Entries</div>

  <script>
    // 🔗 Connected Google Apps Script endpoint
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxXSDFvqvORqQAZuhZr5ad0WfASzi6OF9JgD0or8mQK5B6Jf8D63EXlqonTo0qALr3b-Q/exec';

    const form = document.getElementById('ghoulForm');
    const loading = document.getElementById('loading');
    const downloadBtn = document.getElementById('downloadBtn');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      loading.style.display = 'block';

      try {
        const response = await fetch(scriptURL, { method: 'POST', body: new FormData(form) });
        const result = await response.text();

        if (result.includes('Success')) {
          alert('🕸️ Your entry has been saved!');
          form.reset();
        } else {
          alert('⚠️ Failed to save entry. Please try again.');
        }
      } catch (error) {
        alert('👻 Network error. Please try again.');
      } finally {
        loading.style.display = 'none';
      }
    });

    // 👑 Admin CSV download
    downloadBtn.addEventListener('click', () => {
      window.open(scriptURL, '_blank');
    });
  </script>
</body>
</html>
